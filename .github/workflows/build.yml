name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config gcc g++ \
            libraylib-dev libssl-dev libsodium-dev libmysqlclient-dev \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxcursor-dev libxext-dev libxfixes-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist/securetty
          install -m 755 client dist/securetty/client
          install -m 755 server dist/securetty/server
          install -m 644 README.md LICENSE Pixellari.ttf dist/securetty/
          tar -C dist -czf securetty-linux-x86_64.tar.gz securetty

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: securetty-linux-x86_64
          path: securetty-linux-x86_64.tar.gz

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: securetty-linux-x86_64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          gh release create "$tag" securetty-linux-x86_64.tar.gz \
            --title "SecureTTY $tag" \
            --generate-notes
